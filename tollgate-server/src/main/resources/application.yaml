spring:
  application:
    name: tollgate
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  address: ${TOLLGATE_ADDRESS:127.0.0.1}
  shutdown: graceful

management:
  server:
    port: 9090
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,audit

springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
