[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tollgate-client"
version = "0.1.0"
description = "OpenAI and Anthropic clients pointed at a Tollgate gateway"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jamal Akhras" }]
keywords = ["llm", "gateway", "openai", "anthropic", "audit", "budget", "policy", "tollgate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
openai = ["openai>=3.52,<4"]
anthropic = ["anthropic>=2.9,<3"]

[project.urls]
Homepage = "https://github.com/Jamal-Akhras/tollgate"
Repository = "https://github.com/Jamal-Akhras/tollgate"
Changelog = "https://github.com/Jamal-Akhras/tollgate/blob/main/CHANGELOG.md"
Issues = "https://github.com/Jamal-Akhras/tollgate/issues"
Documentation = "https://github.com/Jamal-Akhras/tollgate/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/tollgate"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
