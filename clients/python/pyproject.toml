[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tollgate-client"
version = "0.1.0"
description = "OpenAI and Anthropic clients pointed at a Tollgate gateway"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
openai = ["openai>=3.52,<4"]
anthropic = ["anthropic>=2.9,<3"]

[project.urls]
Repository = "https://github.com/Jamal-Akhras/tollgate"

[tool.hatch.build.targets.wheel]
packages = ["src/tollgate"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
