name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Upload to Central, publish the image and draft a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/jamal-akhras/tollgate
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Check the tag matches the project version
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "v$version" != "$GITHUB_REF_NAME" || "$version" == *-SNAPSHOT ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the release version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and verify
        run: ./mvnw -B -ntp -Psbom install
      - name: Upload the libraries to Maven Central for publishing by hand
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Prelease -DskipTests -Djacoco.skip=true deploy
      - name: Push the image
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ./mvnw -B -ntp -pl tollgate-server jib:build -Djib.to.tags=latest
          echo "DIGEST=$(cat tollgate-server/target/jib-image.digest)" >> "$GITHUB_ENV"
      - name: Record how the image was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Gather the release files
        run: |
          cp "tollgate-server/target/tollgate-server-$VERSION.jar" "tollgate-$VERSION.jar"
          cp target/bom.json "tollgate-$VERSION.sbom.json"
      - name: Record how the jar was built
        id: jar-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            tollgate-${{ env.VERSION }}.jar
            tollgate-${{ env.VERSION }}.sbom.json
      - name: Draft the GitHub release
        env:
          BUNDLE: ${{ steps.jar-provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "tollgate-$VERSION.sigstore.json"
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --notes-file notes.md \
            --title "Tollgate $VERSION" \
            "tollgate-$VERSION.jar" "tollgate-$VERSION.sbom.json" "tollgate-$VERSION.sigstore.json"
