name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Upload to Central, publish the image and draft a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/jamal-akhras/tollgate
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Check the tag matches the project version
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "v$version" != "$GITHUB_REF_NAME" || "$version" == *-SNAPSHOT ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the release version $version"
            exit 1
          fi
          python_version=$(python3 -c "import tomllib; print(tomllib.load(open('clients/python/pyproject.toml', 'rb'))['project']['version'])")
          if [[ "v$python_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the Python package version $python_version"
            exit 1
          fi
          node_version=$(node -p "require('./clients/typescript/package.json').version")
          if [[ "v$node_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the npm package version $node_version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and verify
        run: ./mvnw -B -ntp -Psbom install
      - name: Upload the libraries to Maven Central for publishing by hand
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Prelease -DskipTests -Djacoco.skip=true deploy
      - name: Push the image
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ./mvnw -B -ntp -pl tollgate-server jib:build -Djib.to.tags=latest
          echo "DIGEST=$(cat tollgate-server/target/jib-image.digest)" >> "$GITHUB_ENV"
      - name: Record how the image was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Gather the release files
        run: |
          cp "tollgate-server/target/tollgate-server-$VERSION.jar" "tollgate-$VERSION.jar"
          cp target/bom.json "tollgate-$VERSION.sbom.json"
          (cd tollgate-console && PATH="$PWD/target/node:$PATH" npm sbom --omit dev --sbom-format cyclonedx > "../tollgate-$VERSION.console.sbom.json")
      - name: Record how the jar was built
        id: jar-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            tollgate-${{ env.VERSION }}.jar
            tollgate-${{ env.VERSION }}.sbom.json
            tollgate-${{ env.VERSION }}.console.sbom.json
      - name: Draft the GitHub release
        env:
          BUNDLE: ${{ steps.jar-provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "tollgate-$VERSION.sigstore.json"
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --notes-file notes.md \
            --title "Tollgate $VERSION" \
            "tollgate-$VERSION.jar" "tollgate-$VERSION.sbom.json" "tollgate-$VERSION.console.sbom.json" "tollgate-$VERSION.sigstore.json"

  packages:
    name: Build the Python and TypeScript packages
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the wheel and the sdist
        run: |
          pip install --require-hashes -r requirements-dev.txt
          python -m build --no-isolation
        working-directory: clients/python
      - name: Build the npm package
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack
        working-directory: clients/typescript
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: clients/python/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: clients/typescript/*.tgz
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: packages
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    name: Publish to npm
    needs: packages
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check npm is new enough for trusted publishing
        run: |
          version=$(npm --version)
          if [[ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n1)" != "11.5.1" ]]; then
            echo "npm $version is older than 11.5.1"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package
      - name: Publish the tarball
        run: npm publish package/*.tgz --access public
