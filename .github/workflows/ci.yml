name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Java 21 baseline
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Verify (formatting, Error Prone, NullAway, tests, coverage, API contract, SBOM)
        run: ./mvnw -B -ntp -Psbom install
      - name: Run the embeddable modules' tests on the Java 21 baseline
        run: ./mvnw -B -ntp -pl tollgate-core,tollgate-providers,tollgate-spring-boot-starter test -Djvm="$JAVA_HOME_21_X64/bin/java"
      - name: Build the container image and run commands in it
        run: |
          ./mvnw -B -ntp -pl tollgate-server jib:dockerBuild -Djib.from.platforms=linux/amd64 -Djib.to.image=tollgate:ci
          docker run --rm tollgate:ci audit keys create | grep -q "TOLLGATE_AUDIT_SIGNING_KEY="
          mkdir init-check
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/init-check:/work" -w /work tollgate:ci init
          test -s init-check/tollgate.yaml
          test -s init-check/tollgate.env
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: error

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Mutation coverage on core
        run: ./mvnw -B -ntp -pl tollgate-core -Pmutation verify
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-report
          path: tollgate-core/target/pit-reports/

  console:
    name: Console in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build the server and the console
        run: ./mvnw -B -ntp -DskipTests install
      - name: Use the Node the build installed
        run: echo "$PWD/tollgate-console/target/node" >> "$GITHUB_PATH"
      - name: Install the console's packages
        run: npm ci --ignore-scripts
        working-directory: tollgate-console
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tollgate-console
      - name: Drive the console against the server
        run: npm run e2e
        working-directory: tollgate-console
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tollgate-console/playwright-report/
          if-no-files-found: ignore

  clients:
    name: Client libraries against the server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build the server and the console
        run: ./mvnw -B -ntp -DskipTests install
      - name: Use the Node the build installed
        run: echo "$PWD/tollgate-console/target/node" >> "$GITHUB_PATH"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the Python library's tools
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps --no-build-isolation -e .
        working-directory: clients/python
      - name: Check the Python library
        run: ruff check . && ruff format --check . && mypy && python -m unittest discover -s tests
        working-directory: clients/python
      - name: Run the Python library against the server
        run: python clients/e2e/serve.py python -m unittest discover -s clients/python/e2e
      - name: Install the TypeScript library's packages
        run: npm ci --ignore-scripts
        working-directory: clients/typescript
      - name: Check the TypeScript library
        run: npm run check
        working-directory: clients/typescript
      - name: Run the TypeScript library against the server
        run: python clients/e2e/serve.py node --test "clients/typescript/e2e/*.test.mjs"
