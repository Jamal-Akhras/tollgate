name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Java 21 baseline
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Verify (formatting, Error Prone, NullAway, tests, coverage, API contract, SBOM)
        run: ./mvnw -B -ntp -Psbom verify
      - name: Run the embeddable modules' tests on the Java 21 baseline
        run: ./mvnw -B -ntp -pl tollgate-core,tollgate-providers surefire:test -Djvm="$JAVA_HOME_21_X64/bin/java"
      - name: Build the container image and run a command in it
        run: |
          ./mvnw -B -ntp -pl tollgate-server jib:dockerBuild -Djib.from.platforms=linux/amd64 -Djib.to.image=tollgate:ci
          docker run --rm tollgate:ci audit keys create | grep -q "TOLLGATE_AUDIT_SIGNING_KEY="
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: error

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Mutation coverage on core
        run: ./mvnw -B -ntp -pl tollgate-core -Pmutation verify
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-report
          path: tollgate-core/target/pit-reports/
