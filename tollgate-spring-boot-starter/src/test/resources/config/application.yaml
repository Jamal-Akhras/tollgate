tollgate:
  config: src/test/resources/tollgate.yaml

spring:
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true

management:
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        "[gen_ai.client.operation.duration]": true
        "[tollgate.stream.first_event]": true
      minimum-expected-value:
        "[gen_ai.client.operation.duration]": 10ms
        "[tollgate.stream.first_event]": 10ms
      maximum-expected-value:
        "[gen_ai.client.operation.duration]": 10m
        "[tollgate.stream.first_event]": 2m
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,audit
